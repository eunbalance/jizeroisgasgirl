<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지영아 오늘 저녁은?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>

body { margin: 0; background: #0B0B0C; }
a { color: #F2EFE9; } a:hover { color: #FFFFFF; }

.mono { font-family: 'Space Mono', ui-monospace, monospace; }

/* ---------- character ---------- */
.char-body { transform-origin: 100px 292px; animation: sway 1.8s ease-in-out infinite; }
.head { transform-origin: 100px 128px; animation: nod 1.8s ease-in-out infinite; }
.arm-l { transform-origin: 56px 142px; animation: wiggle 0.9s ease-in-out infinite; }
.arm-r { animation: rub 0.8s linear infinite; }
.pony { transform-origin: 140px 40px; animation: swing 0.9s ease-in-out infinite; }
.mode-rolling .pony { animation: swing 0.25s ease-in-out infinite; }
@keyframes swing { 0% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } 100% { transform: rotate(-8deg); } }
.cuff { fill: none; stroke: #FFFFFF; stroke-width: 18; stroke-linecap: butt; }
.limb { fill: none; stroke: #1F4FBF; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
.leg { fill: none; stroke: #6F6C6A; stroke-width: 20; stroke-linecap: round; }
.brow { fill: none; stroke: #3A2418; stroke-width: 3.5; stroke-linecap: round; }
.mouth-line { fill: none; stroke: #3A2418; stroke-width: 3.5; stroke-linecap: round; }
.drool { animation: drool 1.8s ease-in infinite; transform-origin: 112px 116px; }
.growl { animation: floaty 1.6s ease-in-out infinite; }

.mode-rolling .char-body { animation: shake 0.22s linear infinite; }
.mode-rolling .arm-l { animation: wiggle 0.3s ease-in-out infinite; }
.mode-done .char-body { animation: hop 0.7s cubic-bezier(.3,.6,.4,1) infinite; }
.mode-done .arm-l { animation: cheer 0.7s ease-in-out infinite; }
.mode-done .arm-r { animation: none; }

@keyframes sway { 0% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } 100% { transform: rotate(-4deg); } }
@keyframes nod { 0% { transform: rotate(3deg); } 50% { transform: rotate(-5deg); } 100% { transform: rotate(3deg); } }
@keyframes wiggle { 0% { transform: rotate(8deg); } 50% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }
@keyframes rub { 0% { transform: translate(0px, 0px); } 25% { transform: translate(5px, -3px); } 50% { transform: translate(0px, -6px); } 75% { transform: translate(-5px, -3px); } 100% { transform: translate(0px, 0px); } }
@keyframes shake { 0% { transform: translateX(-3px) rotate(-2deg); } 50% { transform: translateX(3px) rotate(2deg); } 100% { transform: translateX(-3px) rotate(-2deg); } }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-18px); } 70% { transform: translateY(0); } 100% { transform: translateY(0); } }
@keyframes cheer { 0% { transform: rotate(150deg); } 50% { transform: rotate(175deg); } 100% { transform: rotate(150deg); } }
@keyframes drool { 0% { transform: scaleY(0.4); opacity: 0; } 30% { opacity: 1; } 80% { transform: scaleY(1.3); opacity: 1; } 100% { transform: scaleY(1.3); opacity: 0; } }
@keyframes floaty { 0% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-6px); opacity: 1; } 100% { transform: translateY(0); opacity: .6; } }
@keyframes urgent { 0% { opacity: 1; } 50% { opacity: .45; } 100% { opacity: 1; } }

.timer-urgent { color: #FF5A3C; animation: urgent 0.6s ease-in-out infinite; }
.ring-prog { transition: stroke-dashoffset 0.9s linear; }

/* ---------- shelf ---------- */
.spine { position: relative; transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease; }
.spine.on { transform: translateY(-26px) scale(1.06); box-shadow: 0 18px 40px rgba(0,0,0,.6), 0 0 0 2px #F2EFE9; }
.spine.on { z-index: 3; }
.spine.off { opacity: .28; }
.food { position: absolute; top: 18%; left: 50%; width: clamp(84px, 16vw, 128px); margin-left: calc(clamp(84px, 16vw, 128px) / -2); pointer-events: none; filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
.food-l { animation: popL .7s cubic-bezier(.2,1.4,.4,1) forwards, bobL 2.2s ease-in-out .7s infinite; }
.food-r { animation: popR .7s cubic-bezier(.2,1.4,.4,1) .08s both, bobR 2.2s ease-in-out .78s infinite; }
.steam { fill: none; stroke: #F2EFE9; stroke-width: 2.5; stroke-linecap: round; opacity: .6; animation: steam 1.6s ease-in-out infinite; }
.noodle { fill: none; stroke: #F6E7B8; stroke-width: 2; stroke-linecap: round; }
@keyframes popL { 0% { transform: translate(0, 40px) scale(.2) rotate(0deg); opacity: 0; } 100% { transform: translate(-112%, -10px) scale(1) rotate(-12deg); opacity: 1; } }
@keyframes popR { 0% { transform: translate(0, 40px) scale(.2) rotate(0deg); opacity: 0; } 100% { transform: translate(112%, -10px) scale(1) rotate(12deg); opacity: 1; } }
@keyframes bobL { 0% { transform: translate(-112%, -10px) rotate(-12deg); } 50% { transform: translate(-112%, -20px) rotate(-8deg); } 100% { transform: translate(-112%, -10px) rotate(-12deg); } }
@keyframes bobR { 0% { transform: translate(112%, -10px) rotate(12deg); } 50% { transform: translate(112%, -20px) rotate(8deg); } 100% { transform: translate(112%, -10px) rotate(12deg); } }
.fly-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
.fly-wrap { position: absolute; animation: flyIn .6s cubic-bezier(.2,1.4,.4,1) both; }
.fly-wrap svg { display: block; width: 100%; filter: drop-shadow(0 12px 20px rgba(0,0,0,.5)); }
@keyframes flyIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes flyA { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(32vw, -22vh) rotate(95deg); } 50% { transform: translate(-8vw, -48vh) rotate(190deg); } 75% { transform: translate(-36vw, -14vh) rotate(285deg); } 100% { transform: translate(0, 0) rotate(360deg); } }
@keyframes flyB { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(-28vw, 30vh) rotate(-80deg); } 50% { transform: translate(20vw, 46vh) rotate(-170deg); } 75% { transform: translate(38vw, 8vh) rotate(-270deg); } 100% { transform: translate(0, 0) rotate(-360deg); } }
@keyframes flyC { 0% { transform: translate(0, 0) rotate(-20deg) scale(1); } 33% { transform: translate(44vw, 26vh) rotate(40deg) scale(1.3); } 66% { transform: translate(-30vw, 40vh) rotate(-60deg) scale(.8); } 100% { transform: translate(0, 0) rotate(-20deg) scale(1); } }
@keyframes flyD { 0% { transform: translate(0, 0) rotate(10deg); } 33% { transform: translate(-46vw, -30vh) rotate(-140deg); } 66% { transform: translate(24vw, -40vh) rotate(120deg); } 100% { transform: translate(0, 0) rotate(370deg); } }
@keyframes steam { 0% { transform: translateY(2px); opacity: 0; } 50% { opacity: .7; } 100% { transform: translateY(-6px); opacity: 0; } }
.btn-main {
  position: relative;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.95), inset 0 -10px 18px rgba(120,108,92,.35), 0 10px 0 #9C958A, 0 22px 32px rgba(0,0,0,.6);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn-main:hover { filter: brightness(1.04); transform: translateY(-2px); box-shadow: inset 0 3px 0 rgba(255,255,255,.95), inset 0 -10px 18px rgba(120,108,92,.35), 0 12px 0 #9C958A, 0 26px 36px rgba(0,0,0,.6); }
.btn-main:active { transform: translateY(8px); box-shadow: inset 0 3px 0 rgba(255,255,255,.8), inset 0 -6px 12px rgba(120,108,92,.4), 0 2px 0 #9C958A, 0 6px 12px rgba(0,0,0,.5); }
.btn-main:disabled { opacity: .55; cursor: default; transform: translateY(8px); box-shadow: inset 0 3px 0 rgba(255,255,255,.8), 0 2px 0 #9C958A; }
.btn-ghost:hover { border-color: #F2EFE9; }

@media (prefers-reduced-motion: reduce) {
  .char-body, .head, .arm-l, .arm-r, .drool, .growl, .timer-urgent, .pony, .steam { animation: none !important; }
  .fly-layer { display: none; }
  .food-l { animation: none !important; transform: translate(-112%, -10px) rotate(-12deg); }
  .food-r { animation: none !important; transform: translate(112%, -10px) rotate(12deg); }
}

[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root" class="mode-idle" style="position: relative; overflow: hidden; min-height: 100vh; box-sizing: border-box; background: #0B0B0C; color: #F2EFE9; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px 16px 64px">

  <div style="width: 100%; max-width: 1180px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">

        <line x1="100" y1="134" x2="100" y2="216" stroke="#E8EEF9" style="stroke-width: 2.5"></line>

<script>
const TOTAL = 30;
const C = 942.48;
const T = (cx, cy, r, f) => ({ cx, cy, r, f });
const MENUS = [
  { name: '순대국', en: 'SUNDAE-GUK', bg: '#D24B2E', fg: '#FFF6EE', desc: '역시 추운 날에는 이만한 게 없지 크아아',
    bowl: '#2B2B2B', broth: '#E6D3B3',
    tops: [T(34, 36, 6, '#3B2A2E'), T(48, 40, 6, '#3B2A2E'), T(62, 35, 6, '#3B2A2E'), T(72, 39, 2.5, '#6FA34A'), T(28, 40, 2.5, '#6FA34A'), T(56, 31, 2.5, '#6FA34A')] },
  { name: '칼국수', en: 'KALGUKSU', bg: '#EAD7A8', fg: '#2A1F12', desc: '여기 칼국수는 들깨가 들어가더라',
    bowl: '#F2F2F0', broth: '#EFE4C8',
    tops: [T(38, 34, 5, '#8DBF5A'), T(64, 37, 5, '#8DBF5A'), T(52, 33, 3.5, '#2F3A2A'), T(72, 34, 3, '#E58A3A')] },
  { name: '짬뽕', en: 'JJAMPPONG', bg: '#6E4BD1', fg: '#F4EFFF', desc: '근데 띠디 웨이팅 가능할까?',
    bowl: '#F2F2F0', broth: '#C9341F',
    tops: [T(36, 35, 6, '#2C2230'), T(62, 34, 6, '#2C2230'), T(50, 40, 5, '#F5E9DC'), T(72, 39, 3, '#F0D9A0'), T(26, 39, 3, '#7DBF4E')] },
  { name: '쌀국수', en: 'PHO', bg: '#3F8F68', fg: '#F0FFF6', desc: '이마트 안 홍대 쌀국수가 잘함 미분당도 좋음',
    bowl: '#F2F2F0', broth: '#D9B77A',
    tops: [T(38, 36, 7, '#8A4B3A'), T(56, 38, 6, '#8A4B3A'), T(66, 32, 3.5, '#4E9A4E'), T(48, 31, 3, '#4E9A4E'), T(74, 38, 4.5, '#B8D94A')] },
  { name: '라멘', en: 'RAMEN', bg: '#F0A43A', fg: '#2A1A06', desc: '라멘야 고고로',
    bowl: '#1E1E1E', broth: '#D99A4E',
    tops: [T(36, 36, 8, '#FFF8EC'), T(36, 36, 4, '#F2A11F'), T(60, 36, 8, '#C98A6A'), T(60, 36, 4, '#E8B596'), T(74, 32, 4, '#1F2A24'), T(48, 31, 2.5, '#7DBF4E'), T(50, 42, 2.5, '#7DBF4E')] }
];

const $ = (id) => document.getElementById(id);
const state = { mode: 'idle', left: TOTAL, hi: null, pick: null };
let rt = null;

function bowlSVG(m, cls, viewBox) {
  const tops = m.tops.map(t => `<circle cx="${t.cx}" cy="${t.cy}" r="${t.r}" fill="${t.f}"></circle>`).join('');
  return `<svg ${cls ? `class="${cls}"` : ''} viewBox="${viewBox}" aria-hidden="true">
    <path class="steam" d="M34 22 Q30 14 35 8 Q40 2 36 -4"></path>
    <path class="steam" d="M52 20 Q48 12 53 6 Q58 0 54 -6"></path>
    <path class="steam" d="M68 22 Q64 14 69 8"></path>
    <path d="M6 38 Q8 80 50 82 Q92 80 94 38 Z" fill="${m.bowl}"></path>
    <path d="M20 70 Q50 78 80 70" fill="none" stroke="#FFFFFF" opacity=".18" style="stroke-width: 3"></path>
    <ellipse cx="50" cy="38" rx="44" ry="12" fill="${m.bowl}"></ellipse>
    <ellipse cx="50" cy="38" rx="39" ry="9" fill="${m.broth}"></ellipse>
    <path class="noodle" d="M22 39 Q30 34 38 39 T54 39 T70 39"></path>
    <path class="noodle" d="M28 43 Q36 38 44 43 T60 43 T76 41"></path>
    ${tops}</svg>`;
}

// build shelf once
const spines = MENUS.map((m, i) => {
  const el = document.createElement('div');
  el.className = 'spine';
  el.style.cssText = `width: clamp(56px, 15vw, 112px); height: clamp(200px, 44vw, 280px); background: ${m.bg}; color: ${m.fg}; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px 6px; box-sizing: border-box`;
  el.innerHTML = `<span class="mono" style="font-size: 12px; font-weight: 700">0${i + 1}</span>
    <span style="writing-mode: vertical-rl; font-size: clamp(20px, 4vw, 30px); font-weight: 900; letter-spacing: .08em">${m.name}</span>
    <span class="mono" style="writing-mode: vertical-rl; font-size: 10px; letter-spacing: .14em; opacity: .75">${m.en}</span>`;
  $('shelf').appendChild(el);
  return el;
});

function makeFlyers(m) {
  const anims = ['flyA', 'flyB', 'flyC', 'flyD'];
  const r = (a, b) => a + Math.random() * (b - a);
  let html = '';
  for (let i = 0; i < 14; i++) {
    const anim = `${anims[i % 4]} ${r(4, 8).toFixed(2)}s ease-in-out ${i % 2 ? 'infinite alternate' : 'infinite'}`;
    html += `<div class="fly-wrap" style="left: ${r(2, 88).toFixed(1)}%; top: ${r(4, 85).toFixed(1)}%; width: ${Math.round(r(56, 130))}px; animation-delay: ${(i * 0.06).toFixed(2)}s">
      <div style="animation: ${anim}">${bowlSVG(m, '', '0 -8 100 92')}</div></div>`;
  }
  return html;
}

function render() {
  const { mode, left, hi, pick } = state;
  const done = mode === 'done';
  const active = mode !== 'idle';
  const p = pick != null ? MENUS[pick] : null;

  $('root').className = 'mode-' + mode;
  $('t-idle').hidden = done;
  $('t-done').hidden = !done;
  if (p) { $('pickName').textContent = p.name + '!'; $('pickName').style.color = p.bg; $('pickDesc').textContent = p.desc; }

  $('time').textContent = '00:' + String(left).padStart(2, '0');
  $('time').className = 'mono' + (mode === 'idle' && left <= 5 ? ' timer-urgent' : '');
  $('ring').style.strokeDashoffset = (C * (1 - left / TOTAL)).toFixed(2);
  $('ring').setAttribute('stroke', left <= 5 ? '#FF5A3C' : '#F2EFE9');

  $('speech').textContent = mode === 'idle' ? '배고파…' : mode === 'rolling' ? '두근두근…' : p.name + ' 좋아!';
  $('growl').style.display = mode === 'idle' ? '' : 'none';
  $('face-hungry').style.display = done ? 'none' : '';
  $('face-happy').style.display = done ? '' : 'none';

  $('btnRoll').hidden = done;
  $('btnRoll').disabled = mode === 'rolling';
  $('btnRoll').textContent = mode === 'rolling' ? '고르는 중…' : '메뉴 골라줘';
  $('btnReset').hidden = !done;

  spines.forEach((el, i) => {
    el.className = 'spine' + (!active ? '' : hi === i ? ' on' : ' off');
  });
}

function roll() {
  if (state.mode !== 'idle') return;
  const finalIdx = Math.floor(Math.random() * MENUS.length);
  const steps = 15 + finalIdx;
  let i = 0;
  state.mode = 'rolling';
  const tick = () => {
    state.hi = i % MENUS.length;
    i++;
    if (i <= steps) {
      render();
      rt = setTimeout(tick, 60 + i * i * 1.3);
    } else {
      state.mode = 'done';
      state.pick = state.hi = steps % MENUS.length;
      const m = MENUS[state.pick];
      spines[state.pick].insertAdjacentHTML('beforeend', bowlSVG(m, 'food food-l', '0 0 100 86') + bowlSVG(m, 'food food-r', '0 0 100 86'));
      $('fly').innerHTML = makeFlyers(m);
      $('fly').hidden = false;
      render();
    }
  };
  tick();
}

function reset() {
  clearTimeout(rt);
  document.querySelectorAll('.food').forEach(el => el.remove());
  $('fly').innerHTML = '';
  $('fly').hidden = true;
  Object.assign(state, { mode: 'idle', left: TOTAL, hi: null, pick: null });
  render();
}

$('btnRoll').addEventListener('click', roll);
$('btnReset').addEventListener('click', reset);

setInterval(() => {
  if (state.mode !== 'idle') return;
  state.left -= 1;
  if (state.left <= 0) { state.left = 0; render(); roll(); }
  else render();
}, 1000);

render();
</script>
</body>
</html>
